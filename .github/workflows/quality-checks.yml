name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium for smoke tests
        run: npx playwright-core install --with-deps chromium

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "index.html"
            "style.css"
            "script.js"
            "src/app.mjs"
            "README.md"
            "LICENSE"
            "vendor/pdf.min.js"
            "vendor/pdf.worker.min.js"
            "vendor/mammoth.browser.min.js"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file" >&2
              exit 1
            fi
          done

      - name: Check CSP meta tag
        shell: bash
        run: |
          set -euo pipefail
          grep -qi 'Content-Security-Policy' index.html

      - name: Check for CDN URLs
        shell: bash
        run: |
          set -euo pipefail

          if grep -REin '(cdn(js)?|unpkg|jsdelivr)' index.html style.css script.js src; then
            echo "CDN reference found in app source files." >&2
            exit 1
          fi

      - name: Check JavaScript syntax
        run: npm run test:syntax

      - name: Validate PWA app shell
        run: npm run test:pwa

      - name: Run browser smoke checks
        run: npm run test:smoke
