name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Full quality suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Resolve Chromium executable
        run: echo "BROWSER_EXE=$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Repository hygiene and source policy
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f sw.js
          test -f manifest.webmanifest
          if grep -REin '(cdn(js)?|unpkg|jsdelivr)' index.html style.css script.js src; then
            echo 'CDN reference found in application source.' >&2
            exit 1
          fi

      - name: Syntax checks
        run: npm run test:syntax

      - name: PWA validation
        run: npm run test:pwa

      - name: Unit and integration tests
        run: npm run test:unit

      - name: Empirical stress tests
        run: npm run test:empirical

      - name: Playwright smoke tests
        run: npm run test:smoke

      - name: Deep Playwright regression tests
        run: npm run test:deep

      - name: Direct Chromium smoke tests
        run: npm run test:chromium
